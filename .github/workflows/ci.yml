name: Task Manager CI

on:
  push:
    branches: [ "main", "ci-failure-demo-for-midterm"]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, and package
        run: mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-jar
          path: target/*.jar
          
      - name: Build Docker image
      	run: docker build -t task-manager:latest .
      	
      -name Save Docker image
       run: docker save -o task-manager-image.tar task-manager:latest
       
      -name: Upload Docker image
       uses: actions/upload-artifact@v4
       with:
       	name: task-manager-docker-image
       	path: task-manager-image.tar
       	if-no-files-found: error